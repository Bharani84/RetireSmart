<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ABC — Learn your letters!</title>
<meta name="description" content="A playful, talking ABC app for little ones: learn each letter with a picture and a sound, then play a fun letter-hunt game. No reading needed.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- PlanWise shared platform shell (master nav + theme) -->
<link rel="stylesheet" href="platform.css">
<script src="platform.js"></script>
<style>
/* ═══ TOKENS (for the shared platform bar) ═══ */
:root{
  --bg:#eef2f7; --card:#fff; --bdr:rgba(0,0,0,.08);
  --acc:#0ea5e9; --acc-bg:rgba(14,165,233,.1); --acc-bdr:rgba(14,165,233,.26);
  --gold:#d97706; --gold-bg:rgba(217,119,6,.1);
  --txt:#1e293b; --txt2:#64748b; --txt3:#94a3b8;
  --ibg:#f1f5f9; --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
[data-theme="dark"]{
  --bg:#0a0f1a; --card:rgba(255,255,255,.05); --bdr:rgba(255,255,255,.09);
  --acc:#38bdf8; --acc-bg:rgba(56,189,248,.16); --acc-bdr:rgba(56,189,248,.32);
  --gold:#f4a261; --gold-bg:rgba(244,162,97,.12);
  --txt:#f0f4f8; --txt2:rgba(240,244,248,.6); --txt3:rgba(240,244,248,.35);
  --ibg:rgba(255,255,255,.06); --sh:none;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--txt);-webkit-tap-highlight-color:transparent}

.hdr{height:40px;background:var(--card);border-bottom:1px solid var(--bdr);box-shadow:var(--sh);position:sticky;top:52px;z-index:90;display:flex;align-items:center;gap:8px;padding:0 14px}
.subnav-lbl{font-size:.82rem;font-weight:800;color:var(--txt)}
.subnav-sub{font-size:.68rem;font-weight:500;color:var(--txt3)}

#stage{position:relative;min-height:calc(100vh - 92px);overflow:hidden;font-family:'Baloo 2','Inter',sans-serif;
  background:linear-gradient(160deg,#22d3ee 0%,#818cf8 50%,#f472b6 100%);
  display:flex;align-items:center;justify-content:center;text-align:center}
#stage::before{content:'';position:absolute;inset:0;pointer-events:none;animation:floaty 9s ease-in-out infinite alternate;background:
  radial-gradient(circle at 16% 20%,rgba(255,255,255,.45) 0 8px,transparent 9px),
  radial-gradient(circle at 82% 18%,rgba(255,255,255,.4) 0 6px,transparent 7px),
  radial-gradient(circle at 72% 80%,rgba(255,255,255,.35) 0 10px,transparent 11px),
  radial-gradient(circle at 26% 82%,rgba(255,255,255,.4) 0 7px,transparent 8px)}
@keyframes floaty{to{transform:translateY(-14px)}}
.scene{position:relative;z-index:2;width:100%;max-width:780px;padding:22px 16px 40px}

.mascot{font-size:clamp(70px,15vw,120px);line-height:1;display:inline-block;filter:drop-shadow(0 8px 14px rgba(0,0,0,.18));animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
.mascot.cheer{animation:cheer .55s ease infinite}
@keyframes cheer{0%,100%{transform:translateY(0) rotate(-6deg) scale(1)}50%{transform:translateY(-20px) rotate(6deg) scale(1.08)}}
.bubble{display:inline-block;margin-top:6px;background:rgba(255,255,255,.95);color:#0369a1;font-weight:800;
  font-size:clamp(1.05rem,3.4vw,1.6rem);padding:11px 20px;border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.08);max-width:92%}

/* home mode buttons */
.modes{display:flex;gap:clamp(14px,4vw,30px);justify-content:center;flex-wrap:wrap;margin-top:26px}
.mode{width:clamp(150px,40vw,210px);border:none;cursor:pointer;border-radius:30px;padding:24px 16px 20px;
  font-family:'Baloo 2';font-weight:800;font-size:clamp(1.2rem,4vw,1.7rem);color:#fff;
  box-shadow:0 12px 0 rgba(0,0,0,.16),0 18px 30px rgba(0,0,0,.2);transition:transform .1s}
.mode:active{transform:translateY(7px);box-shadow:0 5px 0 rgba(0,0,0,.16)}
.mode .ic{font-size:clamp(60px,14vw,92px);line-height:1;display:block;margin-bottom:8px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.mode.learn{background:linear-gradient(160deg,#34d399,#0ea5e9)}
.mode.play{background:linear-gradient(160deg,#f59e0b,#ef4444)}

/* learn card */
.lc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.rbtn{background:rgba(255,255,255,.9);border:none;border-radius:18px;font-size:1.1rem;padding:8px 13px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.1);font-family:'Baloo 2';color:#0369a1;font-weight:800}
.lc-counter{background:rgba(255,255,255,.85);color:#0369a1;font-weight:800;border-radius:16px;padding:6px 14px;font-size:.95rem}
.lcard{border:none;cursor:pointer;border-radius:34px;padding:clamp(20px,5vw,40px) 20px;box-shadow:0 14px 0 rgba(0,0,0,.14),0 22px 40px rgba(0,0,0,.2);
  display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .08s;width:100%}
.lcard:active{transform:scale(.98)}
.lbig{font-family:'Baloo 2';font-weight:800;font-size:clamp(90px,26vw,200px);line-height:.95;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.16)}
.lemoji{font-size:clamp(70px,18vw,130px);line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18));animation:throb 1.4s ease-in-out infinite}
.lemoji.qpulse{animation:qpulse 1s ease-in-out infinite}
@keyframes qpulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.18);opacity:1}}
.qcap{min-height:1.5em;font-family:'Baloo 2';font-weight:800;font-size:clamp(1.05rem,3.8vw,1.6rem);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.16);margin:2px 0}
@keyframes throb{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.lword{font-family:'Baloo 2';font-weight:700;font-size:clamp(1.3rem,5vw,2.1rem);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.14)}
/* handwriting demo — real strokes drawn in order */
.dsvg{width:100%;max-width:300px;height:clamp(150px,34vw,230px);display:block;margin:0 auto;overflow:visible}
.wstroke{fill:none;stroke:#fff;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.wguide{stroke:rgba(255,255,255,.42);stroke-width:1.4;fill:none}
.wguide.dash{stroke-dasharray:3 5}
.wpen{font-size:24px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));transition:opacity .2s}
.lc-tools{display:flex;gap:7px;align-items:center}
.lnav{display:flex;justify-content:space-between;gap:14px;margin-top:18px}
.arrow{flex:1;max-width:160px;background:rgba(255,255,255,.95);border:none;cursor:pointer;border-radius:26px;font-size:clamp(34px,9vw,52px);
  padding:8px 0;color:#0369a1;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.arrow:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.12)}

/* grid overlay */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:9px;max-width:520px;margin:8px auto 0}
.gcell{aspect-ratio:1;border:none;cursor:pointer;border-radius:16px;font-family:'Baloo 2';font-weight:800;font-size:clamp(20px,5vw,30px);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.14)}
.gcell:active{transform:translateY(3px)}

/* play / quiz */
.prog{display:flex;gap:5px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.prog .p{font-size:clamp(16px,4vw,24px);filter:grayscale(1) opacity(.5);transition:.25s}
.prog .p.on{filter:none;transform:scale(1.2)}
.qhint{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:6px}
.qemoji{font-size:clamp(64px,16vw,110px);line-height:1;filter:drop-shadow(0 5px 8px rgba(0,0,0,.18));animation:throb 1.4s ease-in-out infinite}
.qask{font-size:clamp(1.2rem,4.4vw,1.9rem);font-weight:800;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.14)}
.choices{display:flex;gap:clamp(12px,3.5vw,24px);justify-content:center;flex-wrap:wrap;margin-top:18px}
.choice{width:clamp(96px,24vw,150px);height:clamp(110px,26vw,160px);border:none;cursor:pointer;border-radius:28px;
  font-family:'Baloo 2';font-weight:800;font-size:clamp(54px,13vw,86px);color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 0 rgba(0,0,0,.16),0 16px 28px rgba(0,0,0,.18);transition:transform .1s}
.choice:active{transform:translateY(6px)}
.choice.wrong{animation:nope .4s}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px) rotate(-4deg)}75%{transform:translateX(10px) rotate(4deg)}}
.choice.right{animation:yes .5s}
@keyframes yes{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}

.rtitle{font-size:clamp(1.8rem,7vw,3rem);font-weight:800;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.16);margin-top:8px}
.btn{margin-top:22px;display:inline-flex;align-items:center;gap:8px;background:#fff;color:#0284c7;border:none;cursor:pointer;
  font-family:'Baloo 2';font-weight:800;font-size:clamp(1.05rem,3.6vw,1.4rem);padding:13px 28px;border-radius:28px;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.btn:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.btn.sm{font-size:.9rem;padding:9px 18px;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.homebtn{position:absolute;top:12px;left:14px;z-index:5;background:rgba(255,255,255,.9);border:none;border-radius:20px;font-family:'Baloo 2';font-weight:800;font-size:.9rem;color:#0369a1;padding:7px 14px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.12)}

#confetti-layer{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.conf{position:absolute;top:-14px;width:11px;height:14px;border-radius:2px;animation:fall 2.1s linear forwards}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(720deg);opacity:.9}}
.hidden{display:none!important}
</style>
</head>
<body data-app="abc">
<div id="pw-bar"></div>
<header class="hdr">
  <span class="subnav-lbl">🔤 ABC</span>
  <span class="subnav-sub">· Learn your letters, then play!</span>
</header>

<main id="stage">
  <div id="confetti-layer"></div>
  <div class="scene" id="scene"></div>
</main>

<script>
'use strict';
const $ = id => document.getElementById(id);
const scene = $('scene');
const MASCOT = '🦜';

/* ── A–Z with a picture word ──────────────────────────────────────────── */
const LETTERS = [
  ['A','Apple','🍎'],['B','Balloon','🎈'],['C','Cat','🐱'],['D','Dog','🐶'],
  ['E','Elephant','🐘'],['F','Fish','🐟'],['G','Grapes','🍇'],['H','House','🏠'],
  ['I','Ice cream','🍦'],['J','Juice','🧃'],['K','Kite','🪁'],['L','Lion','🦁'],
  ['M','Moon','🌙'],['N','Nose','👃'],['O','Orange','🍊'],['P','Pizza','🍕'],
  ['Q','Queen','👑'],['R','Rainbow','🌈'],['S','Sun','☀️'],['T','Tree','🌳'],
  ['U','Umbrella','☂️'],['V','Violin','🎻'],['W','Watermelon','🍉'],['X','X-ray','🩻'],
  ['Y','Yo-yo','🪀'],['Z','Zebra','🦓'],
].map(([L,w,e])=>({L,w,e}));
const PALETTE = ['#fb7185,#fbbf24','#34d399,#22d3ee','#818cf8,#c084fc','#f472b6,#fb923c','#38bdf8,#a78bfa','#4ade80,#facc15','#f97316,#facc15','#06b6d4,#6366f1'];
const grad = i => `linear-gradient(160deg,${PALETTE[i%PALETTE.length].split(',')[0]},${PALETTE[i%PALETTE.length].split(',')[1]})`;

let state = { li:0, pround:0, pscore:0, pn:8, deck:[] };

/* ── Sound + speech (no files) ────────────────────────────────────────── */
let actx=null, musicDuck=false;
function ac(){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} return actx; }
function tone(freq,dur=0.25,type='sine',vol=0.18,when=0){ const c=ac(); if(!c) return; const o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.value=freq;o.connect(g);g.connect(c.destination); const t=c.currentTime+when;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t);o.stop(t+dur+0.02); }
const chime  = ()=>[523,659,784,1047].forEach((f,i)=>tone(f,0.3,'triangle',0.16,i*0.08));
const pop    = ()=>{tone(660,0.1,'square',0.14);tone(990,0.12,'square',0.1,0.05);};
const sparkle= ()=>[784,988,1319].forEach((f,i)=>tone(f,0.18,'sine',0.12,i*0.07));
const buzz   = ()=>tone(180,0.22,'sawtooth',0.12);
// pick the warmest/smoothest English voice the device offers
function bestVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang||''));
  if(!vs.length) return null;
  const score=v=>{ const n=(v.name||'').toLowerCase();
    if(/siri/.test(n)) return 8;                                   // Siri voices — most natural
    if(/(neural|natural|premium|enhanced)/.test(n)) return 7;      // enhanced/premium versions
    if(/(ava|allison|zoe|nora|evan|nathan)/.test(n)) return 6;     // newer high-quality names
    if(/google/.test(n)) return 6;                                 // Chrome's Google voice — smooth
    if(!v.localService) return 5;                                  // network voices are usually smoother
    if(/(karen|moira|tessa|catherine|shelley|sandy)/.test(n)) return 3;
    if(/samantha/.test(n)) return 2;
    return 1; };
  return vs.slice().sort((a,b)=>score(b)-score(a))[0];
}
function speak(text){ if(!('speechSynthesis'in window))return; try{
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=0.95; u.pitch=1.15; u.volume=1;          // gentle, warm tone
  const v=bestVoice(); if(v)u.voice=v;
  musicDuck=true; const unduck=()=>{ musicDuck=false; }; u.onend=u.onerror=unduck;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
  setTimeout(()=>{ try{ speechSynthesis.resume(); }catch(e){} }, 60);          // nudge (Chrome quirk)
  clearTimeout(speak._t); speak._t=setTimeout(unduck, 700+text.length*72);
}catch(e){} }
function confetti(n=46){ const layer=$('confetti-layer'); for(let i=0;i<n;i++){ const d=document.createElement('div'); d.className='conf';
  d.style.left=Math.random()*100+'%'; d.style.background=`hsl(${Math.random()*360},90%,62%)`;
  d.style.setProperty('--x',(Math.random()*240-120)+'px'); d.style.animationDelay=(Math.random()*0.4)+'s';
  layer.appendChild(d); setTimeout(()=>d.remove(),2600); } }
const shuffle = a => a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);

/* ═══ HOME ═════════════════════════════════════════════════════════════ */
function home(){
  stopAll();
  scene.innerHTML = `
    <div class="mascot">${MASCOT}</div>
    <div><span class="bubble">Pick one! 👇</span></div>
    <div class="modes">
      <button class="mode learn" id="mLearn"><span class="ic">🔤</span>Learn<br>my ABCs</button>
      <button class="mode play" id="mPlay"><span class="ic">🎮</span>Play a<br>game</button>
    </div>`;
  $('mLearn').onclick = ()=>{ ac(); pop(); learnCard(0); };
  $('mPlay').onclick  = ()=>{ ac(); pop(); startPlay(); };
}

/* ═══ LEARN MODE ═══════════════════════════════════════════════════════ */
function homeBtn(){ return `<button class="homebtn" id="homeBtn">🏠 Home</button>`; }

/* ── background music + "sing the ABCs" ──────────────────────────────── */
let musicOn=true, musicTimer=null, singing=false, singTimer=null, narrTimers=[];
/* guided quiz: ask → 3s think → answer, twice (letter, then the word) */
function clearNarr(){ narrTimers.forEach(clearTimeout); narrTimers=[]; const e=$('lemoji'); if(e){ e.classList.remove('qpulse'); if(e.dataset.real){ e.textContent=e.dataset.real; delete e.dataset.real; } } setQ(''); }
function setQ(html){ const c=$('qcap'); if(c) c.innerHTML=html; }
function quizNarrate(d){
  clearNarr();
  const em=$('lemoji'); if(em){ em.dataset.real=d.e; em.textContent='❓'; em.classList.add('qpulse'); }  // show a "?" instead of a blank
  setQ('🤔 …');
  narrTimers = [
    setTimeout(()=>{ setQ('🤔 What letter?'); speak('What letter is this?'); }, 900),
    setTimeout(()=>{ setQ('✅ It’s '+d.L+'!'); sparkle(); speak("It's "+d.L+"!"); }, 3900),         // ~3s think time
    setTimeout(()=>{ setQ('🤔 '+d.L+' is for…?'); speak(d.L+' is for... what?'); }, 5600),
    setTimeout(()=>{ const e=$('lemoji'); if(e){ e.classList.remove('qpulse'); e.textContent=d.e; delete e.dataset.real;
        try{ e.animate([{transform:'scale(0)'},{transform:'scale(1.3)'},{transform:'scale(1)'}],{duration:500,easing:'ease'}); }catch(_){ } }
        setQ('🎉 '+d.w+'!'); confetti(28); chime(); speak(d.w+'! '+d.L+' is for '+d.w+'.'); }, 8700),  // reveal
  ];
}
const NF={C:261.63,D:293.66,E:329.63,F:349.23,G:392,A:440};
// classic ABC-song (Twinkle) tune mapped across all 26 letters
const SONG=['C','C','G','G','A','A','G','F','F','E','E','D','D','C','G','G','F','F','E','E','D','G','F','E','D','C'].map(n=>NF[n]);
const BGLOOP=[392,440,523,587,523,440,392,330];
function startMusic(){ if(!musicOn||singing) return; stopMusic(); let i=0;
  musicTimer=setInterval(()=>{ if(!musicOn||singing)return; tone(BGLOOP[i%BGLOOP.length],0.45,'sine', musicDuck?0.008:0.038); i++; }, 520); }
function stopMusic(){ if(musicTimer)clearInterval(musicTimer); musicTimer=null; }
function singABC(){ stopMusic(); singing=true; let i=0;
  const step=()=>{ if(!singing||i>=26){ stopSing(); return; }
    learnCard(i,{sing:true}); tone(SONG[i],0.5,'triangle',0.16); speak(LETTERS[i].L); i++;
    singTimer=setTimeout(step,820); };
  step(); }
function stopSing(){ singing=false; if(singTimer)clearTimeout(singTimer); singTimer=null; }
function stopAll(){ stopSing(); stopMusic(); clearNarr(); }

/* ── HANDWRITING: real pen strokes for each capital, in writing order ── */
const SVGNS='http://www.w3.org/2000/svg';
// viewBox 0 0 100 120 · top line y=15 · middle y=60 · baseline y=105
const STROKES={
  A:['M50,15 L25,105','M50,15 L75,105','M33,70 L67,70'],
  B:['M30,15 L30,105','M30,15 Q66,15 66,38 Q66,58 30,58','M30,58 Q70,58 70,81 Q70,105 30,105'],
  C:['M72,35 Q58,15 44,15 Q22,15 22,60 Q22,105 44,105 Q58,105 72,85'],
  D:['M30,15 L30,105','M30,15 Q72,18 72,60 Q72,102 30,105'],
  E:['M32,15 L32,105','M32,15 L70,15','M32,60 L60,60','M32,105 L70,105'],
  F:['M32,15 L32,105','M32,15 L70,15','M32,60 L60,60'],
  G:['M72,35 Q58,15 44,15 Q22,15 22,60 Q22,105 44,105 Q72,105 72,72 L72,60 L52,60'],
  H:['M30,15 L30,105','M70,15 L70,105','M30,60 L70,60'],
  I:['M35,15 L65,15','M50,15 L50,105','M35,105 L65,105'],
  J:['M60,15 L60,88 Q60,105 45,105 Q30,105 30,88'],
  K:['M30,15 L30,105','M68,15 L33,62','M42,54 L70,105'],
  L:['M32,15 L32,105','M32,105 L68,105'],
  M:['M25,105 L25,15 L50,68 L75,15 L75,105'],
  N:['M28,105 L28,15 L72,105 L72,15'],
  O:['M50,15 Q22,15 22,60 Q22,105 50,105 Q78,105 78,60 Q78,15 50,15'],
  P:['M32,15 L32,105','M32,15 Q70,15 70,38 Q70,60 32,60'],
  Q:['M50,15 Q22,15 22,60 Q22,105 50,105 Q78,105 78,60 Q78,15 50,15','M56,80 L80,110'],
  R:['M32,15 L32,105','M32,15 Q70,15 70,37 Q70,58 32,58','M46,58 L72,105'],
  S:['M70,33 Q70,15 47,15 Q26,15 26,37 Q26,57 50,60 Q74,63 74,83 Q74,105 50,105 Q30,105 30,88'],
  T:['M25,15 L75,15','M50,15 L50,105'],
  U:['M28,15 L28,82 Q28,105 50,105 Q72,105 72,82 L72,15'],
  V:['M27,15 L50,105 L73,15'],
  W:['M22,15 L37,105 L50,42 L63,105 L78,15'],
  X:['M28,15 L72,105','M72,15 L28,105'],
  Y:['M28,15 L50,60 L72,15','M50,60 L50,105'],
  Z:['M28,15 L72,15 L28,105 L72,105'],
};
let writeToken = 0;
function writeLetter(svg, letter, instant){
  if(!svg) return;
  const my = ++writeToken;                 // cancels any in-flight animation
  svg.setAttribute('viewBox','0 0 100 120');
  svg.innerHTML='';
  // faint guide lines (like practice paper)
  [[15,'wguide'],[60,'wguide dash'],[105,'wguide']].forEach(([y,c])=>{
    const l=document.createElementNS(SVGNS,'line');
    l.setAttribute('x1',6);l.setAttribute('x2',94);l.setAttribute('y1',y);l.setAttribute('y2',y);l.setAttribute('class',c);
    svg.appendChild(l);
  });
  const strokes = STROKES[letter] || ['M50,15 L50,105'];
  const paths = strokes.map(d=>{ const p=document.createElementNS(SVGNS,'path'); p.setAttribute('d',d); p.setAttribute('class','wstroke'); svg.appendChild(p); return p; });
  if(instant){ paths.forEach(p=>{ p.style.strokeDasharray='none'; p.style.strokeDashoffset='0'; }); return; }
  paths.forEach(p=>{ const len=p.getTotalLength(); p.style.strokeDasharray=len; p.style.strokeDashoffset=len; });
  // custom pencil — graphite tip is at the group's (0,0), so it lands exactly on the stroke
  const pen = document.createElementNS(SVGNS,'g'); pen.setAttribute('class','wpen'); pen.style.opacity='0';
  pen.innerHTML = '<line x1="0" y1="0" x2="16" y2="-16" stroke="#f6b73c" stroke-width="5.5" stroke-linecap="round"/>'
                + '<line x1="15" y1="-15" x2="19" y2="-19" stroke="#ef9a9a" stroke-width="6" stroke-linecap="round"/>'
                + '<circle cx="0" cy="0" r="2" fill="#2b2b2b"/>';
  svg.appendChild(pen);
  let i=0;
  function drawStroke(){
    if(my!==writeToken) return;
    if(i>=paths.length){ pen.style.opacity='0'; return; }
    const p=paths[i], len=p.getTotalLength(), dur=Math.max(750, len*13), start=performance.now();   // slow & followable
    (function frame(t){
      if(my!==writeToken) return;
      const k=Math.min(1,(t-start)/dur);
      p.style.strokeDashoffset = len*(1-k);
      const pt=p.getPointAtLength(len*k); pen.setAttribute('transform','translate('+pt.x+' '+pt.y+')'); pen.style.opacity='1';
      if(k<1) requestAnimationFrame(frame); else { i++; setTimeout(drawStroke, 260); }   // small pause between strokes
    })(start);
  }
  requestAnimationFrame(drawStroke);
}

function learnCard(i, opts={}){
  state.li = (i+26)%26; const d = LETTERS[state.li]; const fast=!!opts.sing;
  scene.innerHTML = `
    <div class="lc-top">
      <div class="lc-tools"><button class="rbtn" id="homeBtn">🏠</button><button class="rbtn" id="lGrid">🔤 All</button></div>
      <div class="lc-tools">
        <button class="rbtn" id="lSing">${singing?'⏹ Stop':'🎶 Sing'}</button>
        <div class="lc-counter">${state.li+1}/26</div>
      </div>
    </div>
    <button class="lcard" id="lcard" style="background:${grad(state.li)}">
      <svg class="dsvg" id="dsvg"></svg>
      <div class="qcap" id="qcap"></div>
      <div class="lemoji" id="lemoji">${d.e}</div>
      <div class="lword">${d.L}${d.L.toLowerCase()} · ${d.L} is for ${d.w}</div>
    </button>
    <div class="lnav"><button class="arrow" id="lprev">◀</button><button class="arrow" id="lnext">▶</button></div>`;
  writeLetter($('dsvg'), d.L, fast);
  if(!fast){ quizNarrate(d); }
  $('homeBtn').onclick = ()=>{ stopAll(); home(); };
  $('lcard').onclick   = ()=>{ if(singing)return; pop(); writeLetter($('dsvg'), d.L, false); quizNarrate(d); };
  $('lprev').onclick   = ()=>{ stopSing(); clearNarr(); pop(); learnCard(state.li-1); };
  $('lnext').onclick   = ()=>{ stopSing(); clearNarr(); pop(); confetti(12); learnCard(state.li+1); };
  $('lGrid').onclick   = ()=>{ stopSing(); clearNarr(); letterGrid(); };
  $('lSing').onclick   = ()=>{ singing ? stopSing() : singABC(); };
}
function letterGrid(){
  scene.innerHTML = `${homeBtn()}
    <div class="bubble" style="margin-bottom:8px">Tap a letter! ✨</div>
    <div class="grid">${LETTERS.map((d,i)=>`<button class="gcell" data-i="${i}" style="background:${grad(i)}">${d.L}</button>`).join('')}</div>
    <div style="margin-top:16px"><button class="btn sm" id="gBack">⬅️ Back</button></div>`;
  $('homeBtn').onclick = home;
  $('gBack').onclick = ()=>learnCard(state.li);
  scene.querySelectorAll('.gcell').forEach(c=>c.onclick=()=>{ pop(); learnCard(+c.dataset.i); });
}

/* ═══ PLAY MODE — letter hunt ══════════════════════════════════════════ */
function startPlay(){ state.pround=0; state.pscore=0; state.deck=shuffle(LETTERS.map((_,i)=>i)).slice(0,state.pn); playRound(); }
function playRound(){
  if(state.pround>=state.pn) return playDone();
  const target = LETTERS[state.deck[state.pround]];
  // two distractor letters
  const others = shuffle(LETTERS.filter(d=>d.L!==target.L)).slice(0,2);
  const choices = shuffle([target,...others]);
  const dots = Array.from({length:state.pn},(_,i)=>`<span class="p ${i<state.pround?'on':''}">⭐</span>`).join('');
  scene.innerHTML = `
    ${homeBtn()}
    <div class="prog">${dots}</div>
    <div class="qhint"><div class="qemoji">${target.e}</div><div class="qask">Find the letter ${target.L}!</div></div>
    <div class="choices" id="choices">
      ${choices.map(c=>`<button class="choice" data-l="${c.L}" style="background:${grad(LETTERS.findIndex(x=>x.L===c.L))}">${c.L}</button>`).join('')}
    </div>`;
  $('homeBtn').onclick = home;
  speak(`Find the letter ${target.L}. ${target.L} is for ${target.w}.`);
  scene.querySelectorAll('.choice').forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.l===target.L){
        b.classList.add('right'); chime(); confetti(40); state.pscore++;
        speak(`Yes! ${target.L}!`);
        scene.querySelectorAll('.choice').forEach(x=>x.style.pointerEvents='none');
        state.pround++; setTimeout(playRound, 1100);
      } else {
        b.classList.add('wrong'); buzz(); speak('Try again!');
        setTimeout(()=>b.classList.remove('wrong'),450);
      }
    };
  });
}
function playDone(){
  confetti(80); chime(); speak(`Hooray! You found ${state.pscore} letters! You are a star!`);
  scene.innerHTML = `
    <div class="mascot cheer">${MASCOT}</div>
    <div style="font-size:clamp(80px,22vw,150px)">🏆</div>
    <div class="rtitle">You found ${state.pscore} letters!</div>
    <button class="btn" id="again">🎮 Play again</button>
    <div style="margin-top:12px"><button class="btn sm" id="toLearn">🔤 Learn letters</button></div>`;
  $('again').onclick = ()=>{ pop(); startPlay(); };
  $('toLearn').onclick = ()=>{ pop(); learnCard(0); };
}

/* ═══ BOOT ═════════════════════════════════════════════════════════════ */
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=()=>{}; speechSynthesis.getVoices(); }
window.addEventListener('pw-theme-change',()=>{});
home();
</script>
