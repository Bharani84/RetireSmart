<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids — playful learning games for little ones</title>
<meta name="description" content="A friendly home for kids' learning games: discover how your child learns, the alphabet, listening games, and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="platform.css">
<script src="platform.js"></script>
<style>
:root{
  --bg:#eef2f7; --card:#fff; --bdr:rgba(0,0,0,.08);
  --acc:#7c3aed; --acc-bg:rgba(124,58,237,.1); --acc-bdr:rgba(124,58,237,.26);
  --gold:#d97706; --gold-bg:rgba(217,119,6,.1);
  --txt:#1e293b; --txt2:#64748b; --txt3:#94a3b8;
  --ibg:#f1f5f9; --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
[data-theme="dark"]{
  --bg:#0a0f1a; --card:rgba(255,255,255,.05); --bdr:rgba(255,255,255,.09);
  --acc:#a78bfa; --acc-bg:rgba(167,139,250,.16); --acc-bdr:rgba(167,139,250,.32);
  --gold:#f4a261; --gold-bg:rgba(244,162,97,.12);
  --txt:#f0f4f8; --txt2:rgba(240,244,248,.6); --txt3:rgba(240,244,248,.35);
  --ibg:rgba(255,255,255,.06); --sh:none;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);-webkit-tap-highlight-color:transparent}
.hdr{height:40px;background:var(--card);border-bottom:1px solid var(--bdr);box-shadow:var(--sh);position:sticky;top:52px;z-index:90;display:flex;align-items:center;gap:8px;padding:0 14px}

#stage{min-height:calc(100vh - 92px);background:linear-gradient(160deg,#a78bfa 0%,#7dd3fc 45%,#fda4af 100%);font-family:'Baloo 2','Inter',sans-serif;padding:30px 18px 60px}
.wrap{max-width:920px;margin:0 auto;text-align:center}
.hero-ic{font-size:clamp(56px,12vw,86px);line-height:1;filter:drop-shadow(0 8px 14px rgba(0,0,0,.18));animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.hero-t{font-weight:800;font-size:clamp(1.8rem,6vw,2.8rem);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.16);margin-top:4px}
.hero-s{font-weight:600;font-size:clamp(.95rem,3vw,1.2rem);color:#fff;opacity:.95;margin-top:4px;max-width:600px;margin-left:auto;margin-right:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:30px}
.kcard{display:flex;flex-direction:column;align-items:center;text-align:center;text-decoration:none;color:#fff;border-radius:28px;padding:26px 20px;background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:0 12px 0 rgba(0,0,0,.14),0 18px 32px rgba(0,0,0,.18);transition:transform .12s,box-shadow .12s}
.kcard:hover{transform:translateY(-4px)}
.kcard:active{transform:translateY(4px);box-shadow:0 6px 0 rgba(0,0,0,.14)}
.kcard .ic{font-size:clamp(64px,15vw,96px);line-height:1;filter:drop-shadow(0 5px 8px rgba(0,0,0,.2))}
.kcard .nm{font-weight:800;font-size:clamp(1.3rem,4vw,1.8rem);margin-top:10px}
.kcard .bl{font-weight:600;font-size:clamp(.85rem,2.6vw,1rem);opacity:.95;margin-top:4px;line-height:1.4}
.kcard .go{margin-top:14px;background:rgba(255,255,255,.92);color:#0f172a;font-weight:800;font-size:.9rem;padding:8px 18px;border-radius:20px}
.note{margin-top:26px;color:#fff;opacity:.92;font-weight:600;font-size:.9rem}
</style>
</head>
<body data-app="kids">
<div id="pw-bar"></div>
<header class="hdr"><div id="pw-kidnav"></div></header>
<main id="stage">
  <div class="wrap">
    <div class="hero-ic">🧒</div>
    <div class="hero-t">Kids Corner</div>
    <div class="hero-s">Playful learning games for little ones. Tap one to start! 🎈</div>
    <div class="cards" id="cards"></div>
    <div class="note">More games coming soon ✨</div>
  </div>
</main>
<script>
'use strict';
(function(){
  const PAL=['#fb7185,#fbbf24','#34d399,#22d3ee','#818cf8,#c084fc','#f472b6,#fb923c','#38bdf8,#a78bfa','#4ade80,#facc15'];
  function render(){
    const kids=(window.PlanWise&&window.PlanWise.KIDS)||[];
    document.getElementById('cards').innerHTML = kids.map((k,i)=>`
      <a class="kcard" href="${k.href}" style="--c1:${PAL[i%PAL.length].split(',')[0]};--c2:${PAL[i%PAL.length].split(',')[1]}">
        <span class="ic">${k.icon}</span>
        <span class="nm">${k.name}</span>
        <span class="bl">${k.blurb||''}</span>
        <span class="go">Play ▶</span>
      </a>`).join('');
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',render); else render();
})();
</script>
</body>
</html>
