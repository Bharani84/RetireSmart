<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Listen — listening games for little ones</title>
<meta name="description" content="Two playful listening games for young children: Echo (copy the tune) and Do What I Say (tap what you hear). Builds careful listening, memory, and following instructions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="platform.css">
<script src="platform.js"></script>
<style>
:root{
  --bg:#eef2f7; --card:#fff; --bdr:rgba(0,0,0,.08);
  --acc:#0d9488; --acc-bg:rgba(13,148,136,.1); --acc-bdr:rgba(13,148,136,.26);
  --gold:#d97706; --gold-bg:rgba(217,119,6,.1);
  --txt:#1e293b; --txt2:#64748b; --txt3:#94a3b8;
  --ibg:#f1f5f9; --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
[data-theme="dark"]{
  --bg:#0a0f1a; --card:rgba(255,255,255,.05); --bdr:rgba(255,255,255,.09);
  --acc:#2dd4bf; --acc-bg:rgba(45,212,191,.16); --acc-bdr:rgba(45,212,191,.32);
  --gold:#f4a261; --gold-bg:rgba(244,162,97,.12);
  --txt:#f0f4f8; --txt2:rgba(240,244,248,.6); --txt3:rgba(240,244,248,.35);
  --ibg:rgba(255,255,255,.06); --sh:none;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);-webkit-tap-highlight-color:transparent}
.hdr{height:40px;background:var(--card);border-bottom:1px solid var(--bdr);box-shadow:var(--sh);position:sticky;top:52px;z-index:90;display:flex;align-items:center;gap:8px;padding:0 14px}
.subnav-lbl{font-size:.82rem;font-weight:800}.subnav-sub{font-size:.68rem;font-weight:500;color:var(--txt3)}

#stage{position:relative;min-height:calc(100vh - 92px);overflow:hidden;font-family:'Baloo 2','Inter',sans-serif;
  background:linear-gradient(160deg,#5eead4 0%,#38bdf8 50%,#a78bfa 100%);display:flex;align-items:center;justify-content:center;text-align:center}
#stage::before{content:'';position:absolute;inset:0;pointer-events:none;animation:floaty 9s ease-in-out infinite alternate;background:
  radial-gradient(circle at 16% 20%,rgba(255,255,255,.45) 0 8px,transparent 9px),
  radial-gradient(circle at 82% 18%,rgba(255,255,255,.4) 0 6px,transparent 7px),
  radial-gradient(circle at 72% 80%,rgba(255,255,255,.35) 0 10px,transparent 11px),
  radial-gradient(circle at 26% 82%,rgba(255,255,255,.4) 0 7px,transparent 8px)}
@keyframes floaty{to{transform:translateY(-14px)}}
.scene{position:relative;z-index:2;width:100%;max-width:680px;padding:22px 16px 40px}

.mascot{font-size:clamp(70px,15vw,120px);line-height:1;display:inline-block;filter:drop-shadow(0 8px 14px rgba(0,0,0,.18));animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
.mascot.cheer{animation:cheer .55s ease infinite}
@keyframes cheer{0%,100%{transform:translateY(0) rotate(-6deg) scale(1)}50%{transform:translateY(-20px) rotate(6deg) scale(1.08)}}
.bubble{display:inline-block;margin-top:6px;background:rgba(255,255,255,.95);color:#0f766e;font-weight:800;font-size:clamp(1.05rem,3.4vw,1.6rem);padding:11px 20px;border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.08)}

.modes{display:flex;gap:clamp(14px,4vw,28px);justify-content:center;flex-wrap:wrap;margin-top:26px}
.mode{width:clamp(150px,40vw,210px);border:none;cursor:pointer;border-radius:30px;padding:24px 16px 20px;font-family:'Baloo 2';font-weight:800;font-size:clamp(1.15rem,3.8vw,1.6rem);color:#fff;box-shadow:0 12px 0 rgba(0,0,0,.16),0 18px 30px rgba(0,0,0,.2);transition:transform .1s}
.mode:active{transform:translateY(7px);box-shadow:0 5px 0 rgba(0,0,0,.16)}
.mode .ic{font-size:clamp(56px,13vw,88px);line-height:1;display:block;margin-bottom:8px}
.mode.echo{background:linear-gradient(160deg,#34d399,#0ea5e9)}
.mode.say{background:linear-gradient(160deg,#f59e0b,#ef4444)}

.homebtn{position:absolute;top:12px;left:14px;z-index:6;background:rgba(255,255,255,.92);border:none;border-radius:20px;font-family:'Baloo 2';font-weight:800;font-size:.9rem;color:#0f766e;padding:7px 14px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.scorebar{display:flex;justify-content:center;margin-bottom:10px}
.starbadge{display:inline-flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1px;max-width:min(92vw,560px);background:rgba(255,255,255,.96);font-size:clamp(1.05rem,3.2vw,1.5rem);line-height:1.15;padding:6px 16px;border-radius:24px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.starbadge .newstar{display:inline-block;animation:starin .5s ease}
@keyframes starin{0%{transform:scale(0) rotate(-40deg)}55%{transform:scale(1.6) rotate(8deg)}100%{transform:scale(1)}}
.starbadge.pop{animation:badgepop .55s ease}
@keyframes badgepop{0%{transform:scale(1)}35%{transform:scale(1.4) rotate(-5deg)}65%{transform:scale(1.15) rotate(4deg)}100%{transform:scale(1)}}
.plusone{position:absolute;left:50%;top:16%;transform:translateX(-50%);font-family:'Baloo 2';font-weight:800;font-size:clamp(1.4rem,5vw,2rem);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.22);pointer-events:none;animation:floatup 1.1s ease forwards}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,14px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-52px) scale(1)}}
.starpop{position:absolute;font-size:30px;pointer-events:none;animation:starfly 1.05s ease forwards}
@keyframes starfly{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3) rotate(180deg)}}
.status{font-size:clamp(1.3rem,4.8vw,2.1rem);font-weight:800;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.16);min-height:1.5em;margin-bottom:10px}

/* Echo pads */
.pads{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,3.5vw,22px);max-width:430px;margin:0 auto}
.pad{aspect-ratio:1;border:none;border-radius:28px;cursor:pointer;box-shadow:0 10px 0 rgba(0,0,0,.18),0 16px 28px rgba(0,0,0,.16);opacity:.78;transition:transform .08s,opacity .12s,filter .12s}
.pad:active{transform:scale(.97)}
.pad.lit{opacity:1;filter:brightness(1.4);transform:scale(1.05)}
.pad.p0{background:#fb7185}.pad.p1{background:#34d399}.pad.p2{background:#60a5fa}.pad.p3{background:#fbbf24}

/* Do What I Say tiles */
.choices{display:flex;gap:clamp(12px,3.5vw,24px);justify-content:center;flex-wrap:wrap;margin-top:8px}
.choice{width:clamp(96px,24vw,150px);height:clamp(110px,26vw,160px);border:none;cursor:pointer;border-radius:28px;background:linear-gradient(160deg,var(--c1),var(--c2));display:flex;align-items:center;justify-content:center;box-shadow:0 10px 0 rgba(0,0,0,.16),0 16px 28px rgba(0,0,0,.18);transition:transform .1s}
.choice:active{transform:translateY(6px)}
.choice .em{font-size:clamp(56px,14vw,88px);line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.choice.wrong{animation:nope .4s}@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.choice.right{animation:yes .5s}@keyframes yes{0%{transform:scale(1)}50%{transform:scale(1.22)}100%{transform:scale(1)}}

.rtitle{font-size:clamp(1.8rem,7vw,3rem);font-weight:800;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.16);margin-top:8px}
.btn{margin-top:20px;display:inline-flex;align-items:center;gap:8px;background:#fff;color:#0d9488;border:none;cursor:pointer;font-family:'Baloo 2';font-weight:800;font-size:clamp(1.05rem,3.6vw,1.4rem);padding:13px 28px;border-radius:28px;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.btn:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.btn.sm{font-size:.9rem;padding:9px 18px;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.replay{margin-top:14px}

#confetti-layer{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.conf{position:absolute;top:-14px;width:11px;height:14px;border-radius:2px;animation:fall 2.1s linear forwards}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(720deg);opacity:.9}}
</style>
</head>
<body data-app="listen">
<div id="pw-bar"></div>
<header class="hdr"><div id="pw-kidnav"></div></header>
<main id="stage"><div id="confetti-layer"></div><div class="scene" id="scene"></div></main>

<script>
'use strict';
const $=id=>document.getElementById(id);
const scene=$('scene');
const MASCOT='🐰';

/* ── audio + speech ─────────────────────────────────────────────────── */
let actx=null;
function ac(){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} return actx; }
function tone(freq,dur=0.3,type='sine',vol=0.2,when=0){ const c=ac(); if(!c) return; const o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.value=freq;o.connect(g);g.connect(c.destination); const t=c.currentTime+when;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.start(t);o.stop(t+dur+0.02); }
const chime=()=>[523,659,784,1047].forEach((f,i)=>tone(f,0.3,'triangle',0.16,i*0.08));
const pop=()=>{tone(660,0.1,'square',0.14);tone(990,0.12,'square',0.1,0.05);};
const buzz=()=>tone(160,0.25,'sawtooth',0.12);
function bestVoice(){ const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang||'')); if(!vs.length)return null;
  const s=v=>{const n=(v.name||'').toLowerCase(); if(/siri/.test(n))return 8; if(/(neural|natural|premium|enhanced)/.test(n))return 7; if(/(ava|allison|zoe|nora)/.test(n))return 6; if(/google/.test(n))return 6; if(!v.localService)return 5; if(/(karen|moira|tessa|catherine)/.test(n))return 3; return 1;};
  return vs.slice().sort((a,b)=>s(b)-s(a))[0]; }
function speak(text){ if(!('speechSynthesis'in window))return; try{ const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=0.95;u.pitch=1.15;u.volume=1; const v=bestVoice(); if(v)u.voice=v;
  speechSynthesis.cancel(); speechSynthesis.speak(u); setTimeout(()=>{try{speechSynthesis.resume();}catch(e){}},60);}catch(e){} }
function confetti(n=46){ const layer=$('confetti-layer'); for(let i=0;i<n;i++){ const d=document.createElement('div'); d.className='conf';
  d.style.left=Math.random()*100+'%'; d.style.background=`hsl(${Math.random()*360},90%,62%)`; d.style.setProperty('--x',(Math.random()*240-120)+'px'); d.style.animationDelay=(Math.random()*0.4)+'s';
  layer.appendChild(d); setTimeout(()=>d.remove(),2600); } }
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);

/* ── star score + big celebration ───────────────────────────────────── */
const PRAISE=['Yes!','Great job!','Awesome!','Super!','Wow!','Yay!','Brilliant!','Well done!','Nice!'];
function starBurst(){ const layer=$('confetti-layer'); if(!layer)return;
  for(let i=0;i<10;i++){ const s=document.createElement('div'); s.className='starpop'; s.textContent='⭐';
    s.style.left='50%'; s.style.top='40%'; s.style.setProperty('--dx',(Math.random()*340-170)+'px'); s.style.setProperty('--dy',(-(Math.random()*200+70))+'px');
    layer.appendChild(s); setTimeout(()=>s.remove(),1100); } }
function bumpStar(n){ const b=$('starBadge'); if(b){ b.innerHTML='⭐'.repeat(Math.max(0,n-1))+'<span class="newstar">⭐</span>'; b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
  const layer=$('confetti-layer'); if(layer){ const p=document.createElement('div'); p.className='plusone'; p.textContent='+1 ⭐'; layer.appendChild(p); setTimeout(()=>p.remove(),1100); } }
function celebrate(n, big, say){ confetti(big?80:44); chime(); if(big)chime(); starBurst(); bumpStar(n);
  speak(say || (big ? `Wow! ${n} stars!` : PRAISE[Math.floor(Math.random()*PRAISE.length)])); }
const scorebar=n=>`<div class="scorebar"><span class="starbadge" id="starBadge">${n>0?'⭐'.repeat(n):'<span style="opacity:.35">⭐</span>'}</span></div>`;
const grad=i=>['#fb7185,#fbbf24','#34d399,#22d3ee','#818cf8,#c084fc','#f472b6,#fb923c'][i%4];
let stopT=()=>{};   // cancels any running timed sequence when leaving a screen

/* ── HOME ───────────────────────────────────────────────────────────── */
function home(){
  stopT();
  scene.innerHTML=`<div class="mascot">${MASCOT}</div><div><span class="bubble">Pick a game! 👂</span></div>
    <div class="modes">
      <button class="mode echo" id="mEcho"><span class="ic">🎵</span>Echo<br>copy the tune</button>
      <button class="mode say" id="mSay"><span class="ic">🗣️</span>Do What<br>I Say</button>
    </div>`;
  $('mEcho').onclick=()=>{ ac(); pop(); echoStart(); };
  $('mSay').onclick =()=>{ ac(); pop(); sayStart(); };
}
const homeBtn=()=>`<button class="homebtn" id="homeBtn">🏠 Home</button>`;

/* ════════════ GAME 1 · ECHO (listen & repeat a growing tune) ════════════ */
const PAD_TONE=[330,392,494,587];   // E G B D — a pleasant set
let seq=[], step=0, locked=false, score=0;
function echoStart(){ seq=[]; step=0; score=0; echoNext(); }
function renderEcho(status){
  scene.innerHTML=`${homeBtn()}
    ${scorebar(score)}
    <div class="status" id="echoStatus">${status||'👂 Listen…'}</div>
    <div class="pads">${[0,1,2,3].map(i=>`<button class="pad p${i}" data-i="${i}"></button>`).join('')}</div>
    <div class="replay"><button class="btn sm" id="echoReplay">🔁 Hear it again</button></div>`;
  $('homeBtn').onclick=()=>{ stopT(); home(); };
  $('echoReplay').onclick=()=>{ if(!locked) echoPlay(); };
  scene.querySelectorAll('.pad').forEach(p=>p.onclick=()=>echoTap(+p.dataset.i));
}
function flash(i,dur=380){ const el=scene.querySelector('.pad.p'+i); if(el){ el.classList.add('lit'); setTimeout(()=>el.classList.remove('lit'),dur); } tone(PAD_TONE[i],0.42,'sine',0.2); }
function echoNext(){ seq.push(Math.floor(Math.random()*4)); renderEcho('👂 Listen…'); echoPlay(); }
function echoPlay(){
  locked=true; step=0; setStatus('👂 Listen…');
  const ids=[]; seq.forEach((pad,idx)=>ids.push(setTimeout(()=>flash(pad), 650+idx*640)));
  const endId=setTimeout(()=>{ locked=false; setStatus('👆 Your turn!'); }, 650+seq.length*640+120);
  stopT=()=>{ ids.forEach(clearTimeout); clearTimeout(endId); locked=false; };
}
function setStatus(t){ const s=$('echoStatus'); if(s) s.textContent=t; }
function echoTap(i){
  if(locked) return;
  flash(i);
  if(i===seq[step]){
    step++;
    if(step===seq.length){            // whole tune repeated correctly!
      locked=true; score++; const big=score%5===0;
      celebrate(score, big, big?('Wow! '+score+' in a row!'):null);
      setStatus(big?('🎉 '+score+' stars!'):'🎉 Yes!');
      stopT=()=>{};
      setTimeout(echoNext, 1200);
    }
  } else {                            // forgiving: just listen again, no losing
    buzz(); setStatus('🙂 Oops — listen again!');
    locked=true; setTimeout(echoPlay, 900);
  }
}

/* ════════════ GAME 2 · DO WHAT I SAY (tap what you hear) ════════════════ */
const THINGS=[['dog','🐶'],['cat','🐱'],['rabbit','🐰'],['lion','🦁'],['frog','🐸'],['fish','🐠'],['bird','🐦'],['bee','🐝'],
  ['star','⭐'],['sun','☀️'],['moon','🌙'],['apple','🍎'],['banana','🍌'],['balloon','🎈'],['car','🚗'],['ball','⚽'],
  ['flower','🌸'],['butterfly','🦋'],['turtle','🐢'],['duck','🦆']].map(([n,e])=>({n,e}));
const SAY_ROUNDS=8;
let sRound=0, sScore=0;
function sayStart(){ sRound=0; sScore=0; sayRound(); }
function sayRound(){
  if(sRound>=SAY_ROUNDS) return sayDone();
  const pool=shuffle(THINGS);
  const target=pool[0], opts=shuffle([target,pool[1],pool[2]]);
  scene.innerHTML=`${homeBtn()}
    ${scorebar(sScore)}
    <div class="mascot" style="font-size:clamp(48px,11vw,72px)">${MASCOT}</div>
    <div class="status">👂 Listen…</div>
    <div class="choices" id="choices">${opts.map(o=>`<button class="choice" data-n="${o.n}" style="--c1:${grad(THINGS.indexOf(o)).split(',')[0]};--c2:${grad(THINGS.indexOf(o)).split(',')[1]}"><span class="em">${o.e}</span></button>`).join('')}</div>`;
  $('homeBtn').onclick=()=>{ stopT(); home(); };
  const ask=()=>speak('Tap the '+target.n+'!');
  const t1=setTimeout(ask, 600); stopT=()=>clearTimeout(t1);
  scene.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
    if(b.dataset.n===target.n){ b.classList.add('right');
      scene.querySelectorAll('.choice').forEach(x=>x.style.pointerEvents='none');
      sScore++; const big=sScore%5===0;
      celebrate(sScore, big, big?('Wow! '+sScore+' stars!'):('Yes! '+target.n+'!'));
      sRound++; stopT=()=>{}; setTimeout(sayRound,1300); }
    else { b.classList.add('wrong'); buzz(); speak('Try again. Tap the '+target.n+'!'); setTimeout(()=>b.classList.remove('wrong'),450); }
  });
}
function sayDone(){ confetti(80); chime(); speak('Hooray! You listened so well!');
  scene.innerHTML=`<div class="mascot cheer">${MASCOT}</div><div style="font-size:clamp(80px,22vw,150px)">🏆</div>
    <div class="rtitle">You did it!</div>
    <div class="row" style="margin-top:18px"><button class="btn" id="again">🔁 Again</button><button class="btn sm" id="toHome">🏠 Home</button></div>`;
  $('again').onclick=()=>{ pop(); sayStart(); };
  $('toHome').onclick=()=>{ pop(); home(); };
}

/* ── boot ──────────────────────────────────────────────────────────── */
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=()=>{}; speechSynthesis.getVoices(); }
window.addEventListener('pw-theme-change',()=>{});
home();
</script>
</body>
</html>
